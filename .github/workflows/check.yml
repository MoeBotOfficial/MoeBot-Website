name: Verify and publish website
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Publish verified main to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/deploy-vercel.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_g6U6HhdRl2aCrgXKcKBPDVI9
          VERCEL_PROJECT_ID: prj_ERUqHbLCryhD8F5bgwmtVZDC0eJl
